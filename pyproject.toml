[project]
name = "projetof1"
version = "0.1.0"
description = "Dashboard interativo de dados históricos da Fórmula 1 a partir da OpenF1 API."
authors = [
    {name = "szer02",email = "santiago.shego@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "streamlit (>=1.66.1,<2.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[tool.poetry]
packages = [{include = "projetof1", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "detect-secrets (>=1.5.0,<2.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]
docs = [
    "mkdocs-material (>=9.8.0,<10.0.0)"
]

[tool.poetry.group.docs]
optional = true  # instalado com `poetry install --with docs`

# ---------------------------------------------------------------- Tarefas
# Atalhos executados com `poetry run task <nome>` (taskipy).
[tool.taskipy.tasks]
test = { cmd = "pytest tests/unit/", help = "testes unitários com cobertura (mínimo 50%)" }
lint = { cmd = "ruff check .", help = "lint com Ruff, sem alterar arquivos" }
format = { cmd = "ruff check . --fix && ruff format .", help = "corrige o lint seguro e formata o código" }
docs = { cmd = "mkdocs serve -f docs/mkdocs.yml", help = "documentação local em http://127.0.0.1:8000" }

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"     # limite inferior de requires-python
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    # Conjunto mínimo obrigatório
    "E",    # pycodestyle (erros)
    "W",    # pycodestyle (avisos)
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    # Regras adicionais adotadas pelo time
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "BLE",  # flake8-blind-except
    "T20",  # flake8-print
    "S",    # flake8-bandit
    "PT",   # flake8-pytest-style
    "D",    # pydocstyle
    "TID",  # flake8-tidy-imports (imports relativos proibidos)
    "RUF",  # regras do Ruff
]
ignore = [
    "E501",  # comprimento de linha: gerenciado pelo formatador
    "D100",  # docstring de módulo: opcional
    "D104",  # docstring de pacote: opcional
    "D105",  # docstring de métodos mágicos: opcional
    "D107",  # docstring de __init__: documentar na classe
    "D206",  # conflita com o formatador
    "D300",  # conflita com o formatador
    "W191",  # conflita com o formatador
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert é o mecanismo do pytest
    "D",     # docstrings não exigidas em testes
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["projetof1"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=src/projetof1",
    "--cov-report=term-missing",
    "--cov-fail-under=50",
]
markers = [
    "integration: testes que acessam a API real da OpenF1",
]

# ---------------------------------------------------------------- Coverage
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
