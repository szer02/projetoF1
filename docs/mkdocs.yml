site_name: projetoF1
site_description: Dashboard interativo de dados históricos da Fórmula 1 a partir da OpenF1 API.
docs_dir: docs   # relativo a este arquivo: docs/docs/
site_dir: site   # build em docs/site/ (ignorado no Git)

theme:
  name: material
  language: pt
  palette:
    scheme: slate
    primary: red
    accent: red
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Início: index.md
  - Arquitetura: architecture.md
  - Estrutura do Projeto: project-structure.md
  - Como Rodar Local: running-locally.md
  - Como Rodar Testes: running-tests.md
  - Como Contribuir: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:               # com --strict, cada warn vira erro de build
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
